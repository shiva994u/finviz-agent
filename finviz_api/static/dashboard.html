<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Trader | Top Movers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #151a21;
            --text-primary: #e1e1e1;
            --text-secondary: #8b949e;
            --accent-green: #00f090;
            --accent-red: #ff3b3b;
            --border-color: #2d333b;
            --hover-bg: #1c2128;
            --neon-shadow-green: 0 0 10px rgba(0, 240, 144, 0.2);
            --neon-shadow-red: 0 0 10px rgba(255, 59, 59, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, #8b949e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls button {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .controls button:hover { background: #2ea043; box-shadow: 0 0 12px rgba(46, 160, 67, 0.4); }
        .controls button.refreshing { opacity: 0.7; cursor: not-allowed; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stat-card h3 { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 500; }
        .stat-card .value { font-size: 28px; font-weight: 700; }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
        }

        table { width: 100%; border-collapse: collapse; }
        
        th {
            text-align: left;
            padding: 16px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background: var(--hover-bg); }

        .ticker { font-weight: 700; color: #58a6ff; }
        .company-name { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
        
        .change-pill {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 13px;
            text-align: right;
            width: 80px;
        }

        .positive { color: var(--accent-green); text-shadow: 0 0 10px rgba(0, 240, 144, 0.1); }
        .negative { color: var(--accent-red); text-shadow: 0 0 10px rgba(255, 59, 59, 0.1); }
        
        .loading-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(11, 14, 17, 0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .loading-overlay.active { opacity: 1; pointer-events: all; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="header">
        <div class="logo">ELITE TRADER <span style="font-weight:300; font-size:0.8em; color:#58a6ff">TERMINAL</span></div>
        <div class="controls">
            <button onclick="fetchData()" id="refreshBtn">REFRESH DATA</button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="stat-card">
            <h3>TOTAL MOVERS</h3>
            <div class="value" id="stat-total">--</div>
        </div>
        <div class="stat-card">
            <h3>AVG CHANGE</h3>
            <div class="value" id="stat-avg">--%</div>
        </div>
        <div class="stat-card">
            <h3>MARKET SENTIMENT</h3>
            <div class="value" id="stat-sentiment" style="color: var(--accent-green)">--</div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>TICKER</th>
                    <th>PRICE</th>
                    <th>CHANGE FROM OPEN</th>
                    <th>VOLUME</th>
                    <th>SECTOR</th>
                </tr>
            </thead>
            <tbody id="movers-body">
                <!-- Rows injected here -->
            </tbody>
        </table>
    </div>

    <script>
        // Use the API_V1 path prefix
        const API_URL = '/api/v1/screener/top-movers';

        async function fetchData() {
            const loader = document.getElementById('loader');
            const btn = document.getElementById('refreshBtn');
            
            loader.classList.add('active');
            btn.classList.add('refreshing');
            btn.innerText = 'UPDATING...';

            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                renderData(data);
            } catch (err) {
                console.error(err);
                alert('Failed to fetch data');
            } finally {
                loader.classList.remove('active');
                btn.classList.remove('refreshing');
                btn.innerText = 'REFRESH DATA';
            }
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('en-US', { notation: "compact", maximumFractionDigits: 1 }).format(num);
        }

        function renderData(data) {
            const tbody = document.getElementById('movers-body');
            tbody.innerHTML = '';

            let totalChange = 0;
            let positiveCount = 0;

            data.forEach(item => {
                // Parse fields. Note: Keys depend on EXACT CSV headers from Finviz Elite
                // Based on previous verification: "Change", "Change from Open", "No.", "Ticker", "Company"
                // Assuming "Change from Open" is the percentage we want if available, or "Change"
                
                const ticker = item['Ticker'] || 'UNK';
                const name = item['Company'] || '';
                const price = parseFloat(item['Price']) || 0;
                
                // Try to find change field (case insensitive check done in logic below)
                // In verification we saw 'Change', and also tried to find 'Change from Open'
                // Let's check common keys
                let change = 0;
                if (item['Change from Open']) change = parseFloat(String(item['Change from Open']).replace('%',''));
                else if (item['Change']) change = parseFloat(String(item['Change']).replace('%',''));

                const volume = parseFloat(item['Volume'] || 0);
                const sector = item['Sector'] || '-';

                // Stats aggregation
                totalChange += change;
                if (change > 0) positiveCount++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="ticker">${ticker}</div>
                        <div class="company-name">${name}</div>
                    </td>
                    <td style="font-weight:600">$${price.toFixed(2)}</td>
                    <td>
                        <span class="change-pill ${change >= 0 ? 'positive' : 'negative'}">
                            ${change > 0 ? '+' : ''}${change.toFixed(2)}%
                        </span>
                    </td>
                    <td style="color:var(--text-secondary)">${formatNumber(volume)}</td>
                    <td style="color:var(--text-secondary)">${sector}</td>
                `;
                tbody.appendChild(tr);
            });

            // Update stats
            document.getElementById('stat-total').innerText = data.length;
            
            const avg = data.length ? (totalChange / data.length) : 0;
            const avgEl = document.getElementById('stat-avg');
            avgEl.innerText = (avg > 0 ? '+' : '') + avg.toFixed(2) + '%';
            avgEl.style.color = avg >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';

            const sentimentEl = document.getElementById('stat-sentiment');
            const percentPos = data.length ? (positiveCount / data.length) * 100 : 0;
            sentimentEl.innerText = percentPos > 50 ? 'BULLISH' : 'BEARISH';
            sentimentEl.style.color = percentPos > 50 ? 'var(--accent-green)' : 'var(--accent-red)';
        }

        // Initial Load
        fetchData();
        
        // Auto refresh every 60s
        setInterval(fetchData, 60000);

    </script>
</body>
</html>
