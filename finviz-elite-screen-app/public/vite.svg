<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shape (Optional, usually icons are transparent) -->
  
  <!-- Chart Line -->
  <path d="M15 80 L35 60 L50 70 L85 25" stroke="url(#gradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Arrow Head -->
  <path d="M75 25 H85 V35" stroke="url(#gradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Bars -->
  <rect x="20" y="80" width="10" height="0" fill="#ffffff" opacity="0.1">
    <animate attributeName="height" from="0" to="20" dur="1s" fill="freeze" />
    <animate attributeName="y" from="80" to="60" dur="1s" fill="freeze" />
  </rect>
  <rect x="40" y="80" width="10" height="0" fill="#ffffff" opacity="0.1">
    <animate attributeName="height" from="0" to="30" dur="1.2s" fill="freeze" />
    <animate attributeName="y" from="80" to="50" dur="1.2s" fill="freeze" />
  </rect>
  <rect x="60" y="80" width="10" height="0" fill="#ffffff" opacity="0.1">
    <animate attributeName="height" from="0" to="50" dur="1.4s" fill="freeze" />
    <animate attributeName="y" from="80" to="30" dur="1.4s" fill="freeze" />
  </rect>
</svg>